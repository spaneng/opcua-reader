services:
  # device_agent:
  #   image: spaneng/doover_device_agent:apps
  #   network_mode: host

  opcua_server_simulator:
    build: ./sample
    # network_mode: host
    restart: unless-stopped
    # depends_on:
    #   - device_agent
    environment:
      - APP_KEY=sim_app_key
    ports:
      - 4840:4840
    attach: false      

  application:
    build: ../
    network_mode: host
    restart: unless-stopped
    depends_on:
      # - device_agent
      - opcua_server_simulator
    environment:
      - APP_KEY=fuel_additive_opcua_reader_z2g0e
      - CONFIG_FP=/app/simulators/app_config.json
    # volumes:
    #   - ./app_config.json:/app_config.json
