[project]
name = "opcua-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncua>=1.1.6",
    "pydoover>=1.9.0",
    "transitions>=0.9.2",
]

[project.scripts]
doover-app-run = "opcua_reader:main"
export-config = "opcua_reader.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio==1.67.0",
    "protobuf==5.28.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
