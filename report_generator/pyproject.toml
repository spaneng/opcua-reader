[project]
name = "fuel-additive-report"
version = "0.1.0"
description = "Daily reconciliation PDF report for fuel additive skids"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8.0",
    "pydoover[reports]>=1.17.0",
]

[project.scripts]
export-config = "fuel_additive_report.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuel_additive_report"]

[dependency-groups]
dev = ["pytest>=8.3.5"]
