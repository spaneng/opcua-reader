name: Audit legacy images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory published images (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_legacy_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-image-inventory
          path: legacy-image-inventory.json
