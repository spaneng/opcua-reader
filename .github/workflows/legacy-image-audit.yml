name: Audit legacy images
on:
  workflow_dispatch:
    inputs:
      preserve:
        description: Restore verified historical legacy tags without rebuilding or deploying
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory published images (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_legacy_images.py ${{ inputs.preserve && '--preserve' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-image-inventory
          path: |
            legacy-image-inventory.json
            legacy-image-provenance.json
